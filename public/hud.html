<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <title>BeamDash HUD</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; }
    body.obs, html.obs { background: transparent !important; }
    #hud { position: fixed; inset: 0; width: 100%; height: 100%; }
    body.mirror #hud { transform: scaleX(-1); }
    .hudbar { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; transition: opacity .4s; flex-wrap: wrap; justify-content: flex-end; max-width: 92%; }
    .hudbar.hide { opacity: 0; pointer-events: none; }
    .hudbar .btn { background: rgba(16, 20, 27, .85); }
    body.obs .hudbar { display: none; }
  </style>
</head>
<body>
  <canvas id="hud"></canvas>
  <div class="hudbar" id="bar">
    <a class="btn small" href="/" style="text-decoration:none">◀ Cluster</a>
    <button class="btn small" id="mirror">Mirror (windshield)</button>
    <select class="btn small" id="color" style="width:auto"><option value="#3dffb0">Green</option><option value="#3ad0ff">Cyan</option><option value="#ffffff">White</option><option value="#ffb000">Amber</option></select>
    <button class="btn small" id="fs">Fullscreen</button>
    <button class="btn small" id="obsLink">Copy OBS overlay URL</button>
  </div>
  <script src="/js/client.js"></script>
  <script src="/js/gauges.js"></script>
  <script src="/js/alerts.js"></script>
  <script src="/js/hud.js"></script>
</body>
</html>
