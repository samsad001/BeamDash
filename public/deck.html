<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeamDeck">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <title>BeamDash Deck</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #000; }
    body.deck { display: flex; flex-direction: column; }
    .deckbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #07090d; }
    .deckbar .live { font-family: Rajdhani, sans-serif; font-size: 22px; font-weight: 700; white-space: nowrap; }
    .deckbar .live small { font-size: 13px; color: var(--dim); margin-left: 4px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
    .tabs button { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; white-space: nowrap; }
    .tabs button.on { background: var(--accent); border-color: var(--accent); color: #031021; }
    .pad { flex: 1; display: grid; gap: 10px; padding: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); min-height: 0; grid-auto-rows: 1fr; }
    .key {
      position: relative; border-radius: 18px; border: 1px solid #262c38; background: linear-gradient(180deg, #171b24, #0d1016);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 0; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; color: #e8edf4; padding: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 6px rgba(0,0,0,.5); transition: transform .08s, background .15s, border-color .15s;
    }
    .key:active, .key.down { transform: scale(.95); }
    .key canvas { width: 46%; max-width: 64px; aspect-ratio: 1; }
    .key .glyph { font-size: min(9vw, 40px); line-height: 1; }
    .key .lbl { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: min(3.6vw, 16px); text-align: center; line-height: 1.05; }
    .key .val { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: min(5vw, 22px); color: var(--accent); }
    .key.on { border-color: var(--keycol, var(--accent)); background: linear-gradient(180deg, color-mix(in srgb, var(--keycol, var(--accent)) 35%, #171b24), #0d1016); box-shadow: 0 0 18px color-mix(in srgb, var(--keycol, var(--accent)) 45%, transparent), inset 0 1px 0 rgba(255,255,255,.1); }
    .key.blink { animation: blink .7s steps(2) infinite; }
    @keyframes blink { 50% { border-color: #262c38; box-shadow: none; } }
    .key.add { border-style: dashed; color: var(--dim); font-size: 30px; background: transparent; }
    body.editing .key:not(.add)::after { content: '✎'; position: absolute; top: 6px; right: 9px; font-size: 14px; color: var(--warn); }
    .editbar { display: none; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: #07090d; flex-wrap: wrap; }
    body.editing .editbar { display: flex; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
    .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; }
    .swatches button.on { border-color: #fff; }
  </style>
</head>
<body class="deck">
  <div class="deckbar">
    <span class="live" id="live">--<small>km/h</small></span>
    <div class="tabs" id="tabs"></div>
    <button class="btn small" id="editBtn">Edit</button>
  </div>
  <div class="pad" id="pad"></div>
  <div class="editbar">
    <label style="display:flex;align-items:center;gap:6px">Columns <select id="cols" style="width:auto"><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <button class="btn small" id="pageAdd">+ Page</button>
    <button class="btn small" id="pageRename">Rename page</button>
    <button class="btn small danger" id="pageDel">Delete page</button>
    <button class="btn small" id="resetDeck">Restore default deck</button>
    <a class="btn small" href="/macros" style="text-decoration:none">Macros &amp; URLs</a>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="editor">
    <header><h2>Edit button</h2><button class="btn small" id="edDone">Done</button></header>
    <div class="body">
      <label class="row"><span>Action</span><select id="edAction" style="max-width:62%"></select></label>
      <label class="row"><span>Label (optional)</span><input type="text" id="edLabel" style="max-width:62%" placeholder="Default"></label>
      <div class="row" style="display:block"><span class="muted">Colour when active</span><div class="swatches" id="edColor" style="margin-top:8px"></div></div>
      <div class="btns" style="margin-top:12px"><button class="btn small" id="edLeft">◀ Move</button><button class="btn small" id="edRight">Move ▶</button><button class="btn small danger" id="edDelete">Delete button</button></div>
    </div>
  </section>

  <script src="/js/client.js"></script>
  <script src="/js/gauges.js"></script>
  <script src="/js/deck.js"></script>
</body>
</html>
