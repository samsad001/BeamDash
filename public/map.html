<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#07090d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <title>BeamDash Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { overflow: hidden; }
    .wrap { position: fixed; top: 53px; left: 0; right: 0; bottom: 0; display: flex; }
    #map { flex: 1; min-width: 0; touch-action: none; display: block; width: 100%; height: 100%; }
    .side { width: 340px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
    .tools { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
    .tools .btn { min-width: 44px; padding: 8px 12px; background: rgba(16, 20, 27, .9); }
    .navbox { display: flex; gap: 14px; align-items: center; }
    .navbox .arrow { font-size: 54px; line-height: 1; width: 64px; text-align: center; color: var(--accent); }
    .navbox .big { font-family: Rajdhani, sans-serif; }
    .pop { position: absolute; z-index: 6; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; display: none; gap: 6px; transform: translate(-50%, calc(-100% - 14px)); }
    .pop.show { display: flex; }
    .vlist button { width: 100%; text-align: left; margin-bottom: 6px; display: flex; justify-content: space-between; }
    @media (max-width: 760px) {
      .wrap { flex-direction: column; }
      .side { width: auto; height: 42%; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div style="position:relative;flex:1;min-width:0;min-height:0">
      <canvas id="map"></canvas>
      <div class="tools">
        <button class="btn on" id="follow" title="Follow my car">◎ Follow</button>
        <button class="btn on" id="headUp" title="Rotate with car">⬆ Heading</button>
        <button class="btn" id="zin">＋</button>
        <button class="btn" id="zout">－</button>
        <select id="theme" class="btn" style="width:auto"><option value="dark">Dark</option><option value="night">Night</option><option value="light">Light</option><option value="amber">Amber</option></select>
      </div>
      <div class="pop" id="pop"><button class="btn primary small" id="goHere">Navigate here</button><button class="btn small" id="popX">✕</button></div>
    </div>
    <aside class="side">
      <div class="card" style="margin-bottom:12px"><h3>Navigation</h3>
        <div class="navbox"><div class="arrow" id="nArrow">·</div><div><div class="big" id="nDist">No route</div><div class="muted" id="nSub">Tap the map to choose a destination, or set a waypoint in-game.</div></div></div>
        <div class="kv" style="margin-top:12px"><span>Remaining</span><span id="nRem">—</span><span>ETA</span><span id="nEta">—</span><span>Speed / limit</span><span id="nSpd">—</span></div>
        <div class="btns" style="margin-top:12px"><button class="btn small danger" id="clearRoute">Clear route</button><button class="btn small" id="reloadMap">Reload map</button></div>
      </div>
      <div class="card" style="margin-bottom:12px"><h3>World</h3><div class="kv" id="world"></div></div>
      <div class="card"><h3>Vehicles</h3><div class="vlist" id="vlist"></div></div>
    </aside>
  </div>
  <script src="/js/client.js"></script>
  <script src="/js/gauges.js"></script>
  <script src="/js/mapview.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
